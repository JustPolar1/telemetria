spring.application.name=basica

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/telemetria}
spring.datasource.username=${DB_USERNAME:telemetria}
spring.datasource.password=${DB_PASSWORD:telemetria}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.auth.username=${AUTH_USERNAME}
security.auth.password-hash=${AUTH_PASSWORD_HASH}
security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.issuer=${JWT_ISSUER:telemetry-service}
security.jwt.ttl=${JWT_TTL:PT15M}
