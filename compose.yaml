services:
  parcel-db:
    image: postgres:17
    environment:
      POSTGRES_DB: parcels
      POSTGRES_USER: telemetria
      POSTGRES_PASSWORD: ${PARCEL_DB_PASSWORD:-parcel_dev_only}
    ports:
      - "5433:5432"
    volumes:
      - parcel-db-data:/var/lib/postgresql/data
      - ./databases/init/02-parcels.sql:/docker-entrypoint-initdb.d/01-parcels.sql:ro
      - ./databases/init/04-parcel-sensor.sql:/docker-entrypoint-initdb.d/02-parcel-sensor.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetria -d parcels"]
      interval: 5s
      timeout: 5s
      retries: 15

  telemetry-db:
    image: postgres:17
    environment:
      POSTGRES_DB: telemetria
      POSTGRES_USER: telemetria
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:-telemetry_dev_only}
    ports:
      - "5434:5432"
    volumes:
      - telemetry-db-data:/var/lib/postgresql/data
      - ./databases/init/01-sensors.sql:/docker-entrypoint-initdb.d/01-sensors.sql:ro
      - ./databases/init/03-measurement-types.sql:/docker-entrypoint-initdb.d/02-measurement-types.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetria -d telemetria"]
      interval: 5s
      timeout: 5s
      retries: 15

  parcel-api:
    build:
      context: ./parcel-service
    environment:
      DB_URL: jdbc:postgresql://parcel-db:5432/parcels
      DB_USERNAME: telemetria
      DB_PASSWORD: ${PARCEL_DB_PASSWORD:-parcel_dev_only}
      TELEMETRY_SERVICE_URL: https://telemetry-api:8443
      TELEMETRY_AUTH_USERNAME: ${TELEMETRY_AUTH_USERNAME:?Set TELEMETRY_AUTH_USERNAME in the environment}
      TELEMETRY_AUTH_PASSWORD: ${TELEMETRY_AUTH_PASSWORD:?Set TELEMETRY_AUTH_PASSWORD in the environment}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in the environment}
      JWT_ISSUER: ${JWT_ISSUER:-telemetry-service}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      TLS_KEYSTORE_PATH: file:/run/secrets/tls/parcel-keystore.p12
      TLS_KEYSTORE_PASSWORD: ${PARCEL_TLS_KEYSTORE_PASSWORD:?Set PARCEL_TLS_KEYSTORE_PASSWORD in the environment}
      TLS_KEYSTORE_TYPE: PKCS12
      TELEMETRY_TLS_TRUSTSTORE_PATH: file:/run/secrets/tls/telemetry-truststore.p12
      TELEMETRY_TLS_TRUSTSTORE_PASSWORD: ${TELEMETRY_TLS_TRUSTSTORE_PASSWORD:?Set TELEMETRY_TLS_TRUSTSTORE_PASSWORD in the environment}
      TELEMETRY_TLS_TRUSTSTORE_TYPE: PKCS12
    ports:
      - "8081:8443"
    volumes:
      - type: bind
        source: ${PARCEL_TLS_KEYSTORE_FILE:?Set PARCEL_TLS_KEYSTORE_FILE in the environment}
        target: /run/secrets/tls/parcel-keystore.p12
        read_only: true
      - type: bind
        source: ${TELEMETRY_TLS_TRUSTSTORE_FILE:?Set TELEMETRY_TLS_TRUSTSTORE_FILE in the environment}
        target: /run/secrets/tls/telemetry-truststore.p12
        read_only: true
    depends_on:
      parcel-db:
        condition: service_healthy
      telemetry-api:
        condition: service_started

  telemetry-api:
    build:
      context: ./basica
    environment:
      DB_URL: jdbc:postgresql://telemetry-db:5432/telemetria
      DB_USERNAME: telemetria
      DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:-telemetry_dev_only}
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in the environment}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH in the environment}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in the environment}
      JWT_ISSUER: ${JWT_ISSUER:-telemetry-service}
      JWT_TTL: ${JWT_TTL:-PT15M}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      TLS_KEYSTORE_PATH: file:/run/secrets/tls/telemetry-keystore.p12
      TLS_KEYSTORE_PASSWORD: ${TELEMETRY_TLS_KEYSTORE_PASSWORD:?Set TELEMETRY_TLS_KEYSTORE_PASSWORD in the environment}
      TLS_KEYSTORE_TYPE: PKCS12
    ports:
      - "8082:8443"
    volumes:
      - type: bind
        source: ${TELEMETRY_TLS_KEYSTORE_FILE:?Set TELEMETRY_TLS_KEYSTORE_FILE in the environment}
        target: /run/secrets/tls/telemetry-keystore.p12
        read_only: true
    depends_on:
      telemetry-db:
        condition: service_healthy

volumes:
  parcel-db-data:
  telemetry-db-data:
