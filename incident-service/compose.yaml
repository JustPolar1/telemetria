services:
  incident-db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${INCIDENT_MONGO_PORT:-27018}:27017"
    volumes:
      - incident-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  incident-api:
    build: .
    environment:
      MONGODB_URI: mongodb://incident-db:27017/incidents
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      incident-db:
        condition: service_healthy
volumes:
  incident-db-data:
