spring.application.name=parcel-service
server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE_PATH}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=${TLS_KEYSTORE_TYPE:PKCS12}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/parcels}
spring.datasource.username=${DB_USERNAME:telemetria}
spring.datasource.password=${DB_PASSWORD:telemetria}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
telemetry.service.url=${TELEMETRY_SERVICE_URL:https://localhost:8443}
telemetry.service.connect-timeout=${TELEMETRY_CONNECT_TIMEOUT:2s}
telemetry.service.read-timeout=${TELEMETRY_READ_TIMEOUT:3s}
telemetry.service.auth.username=${TELEMETRY_AUTH_USERNAME:${AUTH_USERNAME}}
telemetry.service.auth.password=${TELEMETRY_AUTH_PASSWORD}
telemetry.service.tls.trust-store=${TELEMETRY_TLS_TRUSTSTORE_PATH:}
telemetry.service.tls.trust-store-password=${TELEMETRY_TLS_TRUSTSTORE_PASSWORD:}
telemetry.service.tls.trust-store-type=${TELEMETRY_TLS_TRUSTSTORE_TYPE:PKCS12}

security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.issuer=${JWT_ISSUER:telemetry-service}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
